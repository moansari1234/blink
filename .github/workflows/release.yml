name: Release Blink

on:
  push:
    tags:
      - 'v*.*.0'         # Auto-triggers on Level 1 (Major: vX.0.0) & Level 2 (Minor: vX.Y.0)
  workflow_dispatch:      # Allows manual trigger for Level 3 (Patch: vX.Y.Z) from GitHub Actions UI

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache (Lightning Fast Builds)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Run Unit Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Application (MSI & EXE)
        run: npx @tauri-apps/cli build

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
