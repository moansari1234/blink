[package]
name = "blink"
version = "1.3.0"
description = "Lightweight 20-20-20 break reminder desktop app"
authors = ["Blink Contributors"]
edition = "2021"

[lib]
name = "blink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["full"] }
rodio = { version = "0.19", default-features = false, features = ["wav", "vorbis", "mp3", "flac"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
directories = "5"
rand = "0.8"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Shell",
    "Win32_System_Power",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
